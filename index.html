const monBox=(v,sub,tap)=>'<div class="liters soft wide'+(tap?' tap" '+(tap==="cat"?"data-cat":"data-g")+'="monster':'')+'">'+MI+' Monster<b>'+v+'</b>'+(sub?'<span class="sub">'+sub+'</span>':"")+'</div>';
function renderStats(){
  const{s,e,label}=range();$("rangeLabel").textContent=label;
  const tot=totals(data,s,e);
  const lit=id=>GROUPS.find(g=>g.id===id).sizes.reduce((a,z)=>a+(tot[id+"_"+z[0]]||0)*z[2],0);
  const ids=tab==="drink"?["bier","cider","monster"]:["jaeger","mix","shots"];
  const rows=ids.map(id=>{
    const g=GROUPS.find(x=>x.id===id);
    const parts=g.sizes.map(z=>({z,n:tot[g.id+"_"+z[0]]||0}));
    const n=parts.reduce((a,p)=>a+p.n,0);
    const det=g.sizes.length>1?parts.map(p=>p.n+"× "+p.z[1]).join(", "):g.sizes[0][1];
    return '<div class="stat"><div>'+g.name+'<span>'+det+'</span></div><strong>'+n+'</strong></div>';
  }).join("");
  const top=tab==="drink"?'<div class="lgrid"><div class="liters tap" data-g="bier">'+IC.bier+' Bier insgesamt<b>'+fmt(lit("bier"))+' L</b></div><div class="liters tap" data-g="cider">'+IC.cider+' Cider insgesamt<b>'+fmt(lit("cider"))+' L</b></div>'+monBox(fmt(lit("monster"))+" L","",true)+'</div>':"";
  if(tab==="other"){
    const box=id=>{const g=GROUPS.find(x=>x.id===id),n=tot[id+"_x"]||0;return '<div class="liters tap" data-g="'+id+'">'+IC[id]+' '+g.name+'<b>'+n+' <small>'+g.sizes[0][1]+'</small></b></div>'};
    $("stats").innerHTML='<div class="lgrid three">'+ids.map(box).join("")+'</div>';
    return;
  }
  $("stats").innerHTML=top+rows;
}

const enc=encodeURIComponent,UPS={Prefer:"resolution=merge-duplicates,return=minimal"};
async function api(path,o){o=o||{};
  const r=await fetch(SB_URL+"/rest/v1/"+path,{method:o.method||"GET",body:o.body?JSON.stringify(o.body):undefined,headers:Object.assign({apikey:SB_KEY,"Content-Type":"application/json"},o.headers||{})});
  if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}
function syncDay(day,c){if(!uid)return;
  (Object.keys(c).length?api("entries",{method:"POST",headers:UPS,body:{nick_key:uid,day:day,counts:c}}):api("entries?nick_key=eq."+enc(uid)+"&day=eq."+day,{method:"DELETE"})).catch(e=>console.error(e))}
async function loadData(upload){
  if(upload){const rows=Object.keys(data).map(d=>({nick_key:uid,day:d,counts:data[d]}));if(rows.length)await api("entries",{method:"POST",headers:UPS,body:rows});return}
  const rows=await api("entries?nick_key=eq."+enc(uid)+"&select=day,counts");
  data={};rows.forEach(x=>data[x.day]=x.counts);persist();renderCal();renderStats();
}
async function loadGroups(){

const rpc=(f,body)=>api("rpc/"+f,{method:"POST",body:body});
async function go(){
  const v=$("nickIn").value.trim(),pw=$("pwIn").value,err=$("nickErr");
  if(!/^[\p{L}\p{N}_.-]{2,20}$/u.test(v)){err.textContent="Nickname: 2–20 Zeichen (Buchstaben, Zahlen, _ . -)";return}
  if(!pw){err.textContent="Bitte ein Passwort eingeben.";return}
  if(lm!=="login"){
    if(pw.length<6){err.textContent="Das Passwort braucht mindestens 6 Zeichen.";return}
    if(pw!==$("pw2In").value){err.textContent="Die Passwörter stimmen nicht überein.";return}
  }
  err.textContent="";const k=v.toLowerCase();let create=false;
  try{
    if(lm==="reg"){
      if(!await rpc("auth_register",{k:k,n:v,pw:pw})){err.textContent="Dieser Nickname ist schon vergeben.";return}
      create=true;
    }else if(lm==="set"){
      if(!await rpc("auth_setpw",{k:k,pw:pw})){err.textContent="Das Passwort konnte nicht gesetzt werden.";return}
    }else{
      const st=await rpc("auth_status",{k:k});
      if(st==="none"){err.textContent="Nickname nicht gefunden. Bitte registrieren.";return}
      if(st==="nopw"){setLm("set");$("pwIn").value="";return}
      if(!await rpc("auth_login",{k:k,pw:pw})){err.textContent="Nickname oder Passwort ist falsch.";return}
    }
    const u=await api("users?key=eq."+enc(k)+"&select=nick");
    uid=k;nick=u.length?u[0].nick:v;
    try{localStorage.setItem("td_user",JSON.stringify({uid:uid,nick:nick}))}catch(e){}
    $("nickOv").classList.remove("open");
    await loadData(create);await loadGroups();await loadFriends();renderFriends();dailyFlame();
  }catch(e){err.textContent="Fehler: "+String(e.message||e).slice(0,200)}
}
$("lmGo").onclick=go;
["nickIn","pwIn","pw2In"].forEach(id=>$(id).addEventListener("keydown",e=>{if(e.key==="Enter")go()}));
async function init(){
  if(!CONF){renderFriends();dailyFlame();return}
  let saved=null;try{saved=JSON.parse(localStorage.getItem("td_user")||"null")}catch(e){}
  if(!saved){showLogin("login");return}
  uid=saved.uid;nick=saved.nick;renderFriends();
  try{
    const st=await rpc("auth_status",{k:uid});
    if(st==="none"){uid=null;try{localStorage.removeItem("td_user")}catch(e){}showLogin("login");return}
    if(st==="nopw"){$("nickIn").value=nick;showLogin("set");return}
    await loadData(false);await loadGroups();await loadFriends();
  }catch(e){console.error(e)}
  renderFriends();dailyFlame();
}

function memberHtml(r,extra){
  const t=r.t,sz=id=>GROUPS.find(g=>g.id===id).sizes.map(z=>(t[id+"_"+z[0]]||0)+"× "+z[1]).join(" · ");
  const NI={"Bier":"bier","Cider":"cider","Jäger":"jaeger","Mischen":"mix","Shots":"shots"};
  const box=(n,v,sub)=>'<div class="liters">'+(NI[n]?IC[NI[n]]+' ':"")+n+'<b>'+v+'</b>'+(sub?'<span class="sub">'+sub+'</span>':"")+'</div>';
  const c=id=>t[id+"_x"]||0;
  return '<details class="mdet"><summary><b>'+esc(r.name)+(r.k===uid?" (du)":"")+(r.owner?" · Ersteller":"")+'</b><span>Bier '+fmt(litOf(t,"bier"))+' L · Cider '+fmt(litOf(t,"cider"))+' L</span></summary>'
   +'<div class="lgrid">'+box("Bier",fmt(litOf(t,"bier"))+" L",sz("bier"))+box("Cider",fmt(litOf(t,"cider"))+" L",sz("cider"))+monBox(fmt(litOf(t,"monster"))+" L",sz("monster"))+'</div>'
   +'<div class="lgrid three">'+box("Jäger",c("jaeger"))+box("Mischen",c("mix"))+box("Shots",c("shots"))+'</div>'+(extra||"")+'</details>';
}
const delBtn=(act,r,txt)=>'<button class="sm danger" data-act="'+act+'" data-k="'+esc(r.k)+'" data-n="'+esc(r.name)+'">'+esc(r.name)+txt+'</button>';
async function fetchRs(ks){
  if(!ks.length)return[];
  const{s,e}=range(),list=ks.map(enc).join(",");
  const[us,es]=await Promise.all([api("users?key=in.("+list+")&select=key,nick"),api("entries?nick_key=in.("+list+")&day=gte."+key(s)+"&day=lte."+key(e)+"&select=nick_key,day,counts")]);
  return ks.map(k=>{const days={};es.filter(x=>x.nick_key===k).forEach(x=>days[x.day]=x.counts);const u=us.find(x=>x.key===k);return{k:k,name:u?u.nick:k,t:totals(days,s,e)}});
}
const updateDot=()=>document.querySelectorAll(".dot").forEach(d=>d.hidden=!reqIn.length);
async function loadFriends(){
  const[m,ri,ro]=await Promise.all([api("friends?a=eq."+enc(uid)+"&select=b"),api("friend_requests?to_key=eq."+enc(uid)+"&select=from_key"),api("friend_requests?from_key=eq."+enc(uid)+"&select=to_key")]);
  const ids=[...new Set(m.map(x=>x.b).concat(ri.map(x=>x.from_key),ro.map(x=>x.to_key)))];
  const us=ids.length?await api("users?key=in.("+ids.map(enc).join(",")+")&select=key,nick"):[];
  const nm=k=>{const u=us.find(x=>x.key===k);return{k:k,nick:u?u.nick:k}};
  friends=m.map(x=>nm(x.b));reqIn=ri.map(x=>nm(x.from_key));reqOut=ro.map(x=>nm(x.to_key));updateDot();
}
const delReq=(f,t)=>api("friend_requests?from_key=eq."+enc(f)+"&to_key=eq."+enc(t),{method:"DELETE"});

      const days={};es.forEach(x=>{(days[x.nick_key]=days[x.nick_key]||{})[x.day]=x.counts});
      const uv={};Object.keys(days).forEach(k=>uv[k]=mval(totals(days[k],s,e),m));
      body.innerHTML=lbRows(gs.map(g=>{const mk=ms.filter(x=>x.code===g.code);return{name:g.name,sub:mk.length+" Mitglieder",v:mk.reduce((a,x)=>a+(uv[x.nick_key]||0),0),me:groups.some(y=>y.id===g.code)}}),m);
    }else{
      const ks=lbSrc==="friends"?[uid].concat(friends.map(f=>f.k)):(await api("members?code=eq."+enc(lbSrc)+"&select=nick_key")).map(x=>x.nick_key);
      const rs=await fetchRs(ks);
      body.innerHTML=lbRows(rs.map(r=>({name:r.name,v:mval(r.t,m),me:r.k===uid})),m);
    }
  }catch(e){body.textContent="Daten konnten nicht geladen werden."}
}
$("lb").onclick=ev=>{
  const b=ev.target.closest("button");if(!b)return;const a=b.dataset.act;
  if(a==="lbs")lbSrc=b.dataset.v;else if(a==="lbm")lbMetric=b.dataset.v;
  else if(a==="lbp"){period=b.dataset.p;offset=0;[...$("seg").children].forEach(x=>x.classList.toggle("on",x.dataset.p===period))}
  else return;
  renderLb();
};
$("friends").onclick=async ev=>{
  const ct=ev.target.closest("[data-cat]");if(ct){openCat(ct.dataset.cat);return}
  const b=ev.target.closest("button");if(!b)return;
  const a=b.dataset.act,msg=t=>{const m=$("gmsg");if(m)m.textContent=t},fm=t=>{const m=$("fmsg");if(m)m.textContent=t};
  try{
    if(a==="logout"){uid=null;nick="";groups=[];curG=null;friends=[];reqIn=[];reqOut=[];data={};persist();try{localStorage.removeItem("td_user")}catch(e){}renderCal();renderStats();renderFriends();$("nickIn").value="";showLogin("login")}
    else if(a==="kick"){
      if(!curG||curG.owner!==uid)return;
      if(!confirm(b.dataset.n+" wirklich aus der Gruppe entfernen?"))return;
      await api("members?code=eq."+enc(curG.id)+"&nick_key=eq."+enc(b.dataset.k),{method:"DELETE"});
      renderFriends();
    }
    else if(a==="ftab"){fTab=b.dataset.v;renderFriends()}
    else if(a==="addf"){
      const v=$("fName").value.trim().toLowerCase();
      if(!v)return;if(v===uid){fm("Das bist du selbst.");return}
      if(friends.some(x=>x.k===v)){fm("Ihr seid schon befreundet.");return}
      const u=await api("users?key=eq."+enc(v)+"&select=key");if(!u.length){fm("Nickname nicht gefunden.");return}
      if(reqIn.some(x=>x.k===v)){await acceptReq(v);return}
      await api("friend_requests",{method:"POST",headers:UPS,body:{from_key:uid,to_key:v}});
      await loadFriends();renderFriends();{const m=$("fmsg");if(m){m.className="muted ok";m.textContent="✓ Anfrage an "+v+" wurde gesendet. Sie erscheint unter „Offene Anfragen von dir“."}}
    }
    else if(a==="acc")await acceptReq(b.dataset.k);
    else if(a==="rej"){await delReq(b.dataset.k,uid);await loadFriends();renderFriends()}
    else if(a==="wd"){await delReq(uid,b.dataset.k);await loadFriends();renderFriends()}
    else if(a==="delf"){
      if(!confirm(b.dataset.n+" wirklich als Freund entfernen?"))return;
      const k=b.dataset.k;
      await api("friends?or=(and(a.eq."+enc(uid)+",b.eq."+enc(k)+"),and(a.eq."+enc(k)+",b.eq."+enc(uid)+"))",{method:"DELETE"});
      await loadFriends();renderFriends();
    }
    else if(a==="grp"){curG=groups.find(g=>g.id===b.dataset.c);renderFriends()}
    else if(a==="per"){period=b.dataset.p;offset=0;[...$("seg").children].forEach(x=>x.classList.toggle("on",x.dataset.p===period));renderFriends()}
    else if(a==="create"){
      const n=$("gName").value.trim();if(!n){msg("Bitte einen Gruppennamen eingeben.");return}
      const al="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let c="";for(let i=0;i<6;i++)c+=al[Math.floor(Math.random()*al.length)];
      await api("groups",{method:"POST",headers:{Prefer:"return=minimal"},body:{code:c,name:n,owner:uid}});
      await api("members",{method:"POST",headers:UPS,body:{code:c,nick_key:uid}});
      await loadGroups();curG=groups.find(g=>g.id===c)||curG;renderFriends();
    }else if(a==="join"){
      const c=$("gCode").value.trim().toUpperCase();if(!c){msg("Bitte einen Code eingeben.");return}
      const g=await api("groups?code=eq."+enc(c)+"&select=code");if(!g.length){msg("Code nicht gefunden.");return}
      await api("members",{method:"POST",headers:UPS,body:{code:c,nick_key:uid}});
      await loadGroups();curG=groups.find(g=>g.id===c)||curG;renderFriends();
    }
  }catch(err){const t="Das hat nicht geklappt: "+String(err.message||err).slice(0,160);fm(t);msg(t)}
};
const isAlc=en=>Object.keys(en||{}).some(k=>!k.startsWith("monster_")&&en[k]>0);
function streakOf(){
  const t=new Date(),sf=(t.getDay()+2)%7;
  const fri=o=>new Date(t.getFullYear(),t.getMonth(),t.getDate()-sf-7*o);
  const ok=f=>[0,1,2].some(i=>isAlc(data[key(new Date(f.getFullYear(),f.getMonth(),f.getDate()+i))]));
  let o=0;
  if(!ok(fri(0))){if(sf>2)return 0;o=1}
  let n=0;while(n<600&&ok(fri(o+n)))n++;
  return n;
}
let flT=null;
function playFlame(n,from){
  const num=$("flN"),fl=$("flame");
  num.textContent=from!==undefined&&from<n?from:n;
  $("flT").textContent=n===1?"Wochenende in Folge":"Wochenenden in Folge";
  fl.style.animation="none";void fl.getBoundingClientRect();fl.style.animation="";
  $("flOv").classList.add("open");
  clearTimeout(flT);
  if(from!==undefined&&from<n)flT=setTimeout(()=>{num.textContent=n;num.classList.remove("bump");void num.offsetWidth;num.classList.add("bump");flT=setTimeout(closeFlame,3200)},1100);
  else flT=setTimeout(closeFlame,4500);
}
function closeFlame(){clearTimeout(flT);$("flOv").classList.remove("open")}
$("flGo").onclick=closeFlame;
$("flOv").onclick=e=>{if(e.target===$("flOv"))closeFlame()};
function dailyFlame(){
  const t=key(new Date()),mk=(uid||"lokal")+":"+t;
  let last="";try{last=localStorage.getItem("td_flame")||""}catch(e){}
  if(last===mk)return;
  try{localStorage.setItem("td_flame",mk)}catch(e){}
  const n=streakOf();if(n>0)playFlame(n);
}
let grpRs=[];
function openCat(id){
  const g=GROUPS.find(x=>x.id===id),sized=g.sizes[0][2]>0,{label}=range();
  const rows=grpRs.map(r=>{
    const n=g.sizes.reduce((a,z)=>a+(r.t[id+"_"+z[0]]||0),0);
    return{name:r.name,me:r.k===uid,v:sized?litOf(r.t,id):n,sub:sized?g.sizes.filter(z=>r.t[id+"_"+z[0]]).map(z=>r.t[id+"_"+z[0]]+"× "+z[1]).join(" · "):""};
  }).sort((a,b)=>b.v-a.v);
  const fv=v=>sized?fmt(v)+" L":v+" "+g.sizes[0][1],tot=rows.reduce((a,x)=>a+x.v,0);
  $("cTitle").innerHTML=IC[id]+" "+g.name;
  $("cBody").innerHTML='<p class="muted">'+esc(label)+' · Gesamt: <b>'+fv(tot)+'</b></p>'
    +rows.map(x=>'<div class="lbrow'+(x.me?" me":"")+(x.v?"":" zero")+'"><b>'+esc(x.name)+(x.me?" (du)":"")+(x.sub?' <small>'+esc(x.sub)+'</small>':"")+'</b><strong>'+fv(x.v)+'</strong></div>').join("");
  $("cOv").classList.add("open");document.body.classList.add("lock");
}
function closeCat(){$("cOv").classList.remove("open");document.body.classList.remove("lock")}
$("cClose").onclick=closeCat;
$("cOv").onclick=e=>{if(e.target===$("cOv"))closeCat()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeCat()});
let pg=null,pDay="",pDraft={};
function loadPop(){
  pDraft=Object.assign({},data[pDay]||{});
  $("pForm").innerHTML=pg.sizes.map(z=>{const k=pg.id+"_"+z[0];
    return '<div class="row"><span>'+z[1]+'</span><div class="step"><button data-k="'+k+'" data-d="-1" aria-label="Weniger">−</button><output id="p_'+k+'">'+(pDraft[k]||0)+'</output><button data-k="'+k+'" data-d="1" aria-label="Mehr">+</button></div></div>'}).join("");
}
function openPop(gid){
  pg=GROUPS.find(g=>g.id===gid);if(!pg)return;
  pDay=key(new Date());$("pTitle").innerHTML=IC[pg.id]+" "+pg.name;$("pDate").value=pDay;loadPop();
  $("pOv").classList.add("open");document.body.classList.add("lock");
}
function closePop(){$("pOv").classList.remove("open");document.body.classList.remove("lock")}
$("stats").onclick=e=>{const t=e.target.closest("[data-g]");if(t)openPop(t.dataset.g)};
$("pDate").onchange=e=>{if(e.target.value){pDay=e.target.value;loadPop()}};
$("pForm").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  const k=b.dataset.k;pDraft[k]=Math.max(0,(pDraft[k]||0)+Number(b.dataset.d));$("p_"+k).textContent=pDraft[k];
};
$("pCancel").onclick=closePop;
$("pOv").onclick=e=>{if(e.target===$("pOv"))closePop()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closePop()});
$("pSave").onclick=()=>{
  const sb=streakOf();
  const c=Object.assign({},data[pDay]||{});
  pg.sizes.forEach(z=>{const k=pg.id+"_"+z[0];if(pDraft[k]>0)c[k]=pDraft[k];else delete c[k]});
  if(Object.keys(c).length)data[pDay]=c;else delete data[pDay];
  persist();syncDay(pDay,c);closePop();renderStats();renderCal();
  const sa=streakOf();if(sa>sb)playFlame(sa,sb);
};
const sig=()=>reqIn.length+"|"+reqOut.length+"|"+friends.length;
async function pollFriends(){
  if(!CONF||!uid||document.hidden)return;
  const before=sig();
  try{await loadFriends()}catch(e){return}
  if(sig()!==before&&$("v-friends").classList.contains("on")&&!(document.activeElement&&document.activeElement.matches("input")))renderFriends();
}
setInterval(pollFriends,20000);
document.addEventListener("visibilitychange",pollFriends);
renderCal();renderStats();init();
</script>
